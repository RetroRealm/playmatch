[package]
name = "service"
version.workspace = true
edition.workspace = true

[dependencies]
entity = { path = "../entity" }
tokio = { workspace = true, features = ["macros", "rt"] }
reqwest = { workspace = true, features = ["rustls", "cookies", "stream"] }
serde = { workspace = true, features = ["derive"] }
serde-xml-rs = "^0.8"
quick-xml = "^0.41"
serde_repr = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
chrono = { workspace = true }
chrono-tz = { workspace = true }
rand = "^0.10"
regex = "^1"
lazy_static = "^1"
unicode-normalization = "^0.1"
futures-util = "^0.3"
zip = "^8"
sqlx = { version = "^0.9", default-features = false, features = ["sqlite", "runtime-tokio"] }
async-recursion = "^1.1"
strum = { version = "^0.28", features = ["derive"] }
async-trait = "^0.1"
derive_builder = { workspace = true }
tower = { version = "^0.5", features = ["util", "limit", "retry"] }
oauth2 = { version = "^5", features = ["reqwest"] }
utoipa = { workspace = true, features = ["actix_extras", "uuid", "chrono", "repr", "debug"] }
md-5 = "^0.11"
sha2 = "^0.11"
hmac = "^0.13"
subtle = "^2"
hex = "^0.4"
moka = { version = "^0.12", features = ["future"] }
num_cpus = "^1.16"
bigdecimal = { version = "^0.4", features = ["serde-json"] }
redis = { workspace = true, features = ["tokio-rustls-comp", "aio"] }
prometheus = { workspace = true }
sea-orm = { workspace = true, features = ["debug-print", "runtime-tokio-rustls", "sqlx-postgres"] }

[dev-dependencies]
# Do not enable sea-orm's `mock` feature: it drops the `Clone` impl from
# `DatabaseConnection`, which this crate relies on. DB behavior is tested
# against the Postgres integration test instead.
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
migration = { path = "../migration" }
testcontainers-modules = { version = "^0.15", features = ["postgres", "redis"] }
