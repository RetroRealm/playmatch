[advisories]
version = 2
yanked = "warn"
ignore = [
	# rsa timing sidechannel. Pulled in transitively via sqlx-mysql through
	# sea-orm-migration -> sea-schema -> sqlx. Playmatch only talks to
	# Postgres; the mysql code path is never executed.
	"RUSTSEC-2023-0071",
	# proc-macro-error unmaintained. Pulled in transitively via utoipa 4.x
	# -> utoipa-gen. No safe upgrade path until utoipa 5 lands across our
	# dependent crates.
	"RUSTSEC-2024-0370",
	# proc-macro-error2 unmaintained. Pulled in transitively via sea-orm
	# -> sea-orm-macros -> sea-bae. No replacement until sea-orm moves off
	# it upstream.
	"RUSTSEC-2026-0173",
]

[licenses]
version = 2
confidence-threshold = 0.8

[bans]
multiple-versions = "allow"
wildcards = "warn"
allow-wildcard-paths = true

[sources]
unknown-registry = "warn"
unknown-git = "warn"
