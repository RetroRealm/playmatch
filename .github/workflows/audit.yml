name: "Security Audit"

env:
  CARGO_TERM_COLOR: always

on:
  push:
    branches:
      - main
      - develop
      - feature/*
      - fix/*
  pull_request:
    branches-ignore:
      - main
      - develop
      - feature/*
      - fix/*
  schedule:
    - cron: "0 6 * * 1"

jobs:
  audit:
    name: Cargo audit
    runs-on: "ubuntu-latest"
    steps:
      - name: Checkout Source code
        uses: actions/checkout@v4

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Run cargo audit
        run: cargo audit --ignore RUSTSEC-2023-0071 --ignore RUSTSEC-2024-0370

  deny:
    name: Cargo deny
    runs-on: "ubuntu-latest"
    steps:
      - name: Checkout Source code
        uses: actions/checkout@v4

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: Run cargo deny
        run: cargo deny check advisories bans sources
