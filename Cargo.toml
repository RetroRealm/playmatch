[package]
name = "playmatch"
version.workspace = true
edition.workspace = true
build = "build.rs"
authors = ["DevYukine <devyukine@gmx.de>"]
description = "ROM identification and game metadata service"

[workspace]
members = [".", "api", "service", "entity", "migration", "mcp"]

[workspace.package]
version = "0.2.0"
edition = "2024"

[workspace.dependencies]
tokio = "^1"
reqwest = { version = "^0.13", default-features = false }
sea-orm = "~1"
serde = "^1"
serde_json = "^1"
serde_repr = "^0.1"
chrono = "^0.4"
chrono-tz = "^0.10"
log = "^0.4"
anyhow = "^1"
thiserror = "^2"
# Stay on utoipa 4: version 5 emits OpenAPI 3.1 and we must keep serving 3.0.
utoipa = "~4"
derive_builder = "^0.20"
base64 = "^0.22"
redis = "^1"
prometheus = "^0.14"
# rmcp 2 is blocked until rmcp-actix-web supports it, the latest release still needs 1.x.
rmcp = { version = "1.8", features = ["server", "macros", "transport-streamable-http-server-session"] }

[dependencies]
api = { path = "api" }
service = { path = "service" }
env_logger = "^0.11"
log = { workspace = true }
dotenvy = "^0.15"

[build-dependencies]
built = { version = "^0.8", features = ["chrono", "semver", "git2"] }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
