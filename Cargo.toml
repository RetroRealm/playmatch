[package]
name = "playmatch"
version.workspace = true
edition.workspace = true
build = "build.rs"
authors = ["DevYukine <devyukine@gmx.de>"]
description = "A simple matchmaking service"

[workspace]
members = [".", "api", "service", "entity", "migration"]

[workspace.package]
version = "0.2.0"
edition = "2024"

[workspace.dependencies]
tokio = "^1"
reqwest = { version = "^0.12", default-features = false }
sea-orm = "~1"
serde = "^1"
serde_json = "^1"
serde_repr = "^0.1"
chrono = "^0.4"
log = "^0.4"
anyhow = "^1"
thiserror = "^2"
utoipa = "~4"
derive_builder = "^0.20"
redis = "^1"
prometheus = "^0.14"

[dependencies]
api = { path = "api" }
service = { path = "service" }
env_logger = "^0.11"
log = { workspace = true }
dotenvy = "^0.15"

[build-dependencies]
built = { version = "^0.8", features = ["chrono", "semver", "git2"] }
