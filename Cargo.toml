[package]
name = "playmatch"
version = "0.2.0"
edition = "2024"
build = "build.rs"
authors = ["DevYukine <devyukine@gmx.de>"]
description = "A simple matchmaking service"

[workspace]
members = [".", "api", "service", "entity", "migration"]

[dependencies]
api = { path = "api" }
service = { path = "service" }
env_logger = "^0.11"
log = "^0.4"
dotenvy = "^0.15"

[build-dependencies]
built = { version = "^0.8", features = ["chrono", "semver", "git2"] }
